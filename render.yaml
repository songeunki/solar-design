services:
  - type: web
    name: solar-design-api
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: gunicorn api.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VWORLD_API_KEY
        sync: false
      - key: KAKAO_API_KEY
        sync: false
