services:
  - type: web
    name: solar-design-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VWORLD_API_KEY
        sync: false
      - key: KAKAO_API_KEY
        sync: false
